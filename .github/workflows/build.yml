name: Construire l'APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Numéro de version
        run: echo "NUMERO=$((GITHUB_RUN_NUMBER + 100))" >> $GITHUB_ENV

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Créer le projet Android
        run: flutter create --org sn.lfakebemer --project-name groupeagricole --platforms android --no-pub app_build

      - name: Copier le code de l'application
        run: |
          rm -rf app_build/lib app_build/test
          cp -r lib app_build/lib
          cp pubspec.yaml app_build/pubspec.yaml
          python3 scripts/prepare.py

      - name: Préparer la signature
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: echo "$KEYSTORE_B64" | base64 -d > app_build/android/app/upload.jks

      - name: Construire l'APK
        working-directory: app_build
        env:
          KS_PASS: ${{ secrets.KS_PASS }}
        run: |
          set -o pipefail
          flutter pub get 2>&1 | tee ../build.log
          flutter build apk --release --build-number=$NUMERO 2>&1 | tee -a ../build.log

      - name: Enregistrer le journal en cas d'erreur
        if: failure()
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git checkout --orphan journaux
          git rm -rfq --cached .
          tail -n 300 build.log > erreur.log || echo "pas de journal" > erreur.log
          git add erreur.log
          git commit -qm "Journal d'erreur"
          git push -f origin journaux

      - uses: actions/upload-artifact@v4
        with:
          name: groupe-agricole-apk
          path: app_build/build/app/outputs/flutter-apk/app-release.apk

      - name: Publier la version
        env:
          GH_TOKEN: ${{ github.token }}
          FIREBASE_SA: ${{ secrets.FIREBASE_SA }}
        run: |
          cp app_build/build/app/outputs/flutter-apk/app-release.apk LFARM.apk
          gh release create "v$NUMERO" LFARM.apk --title "Version $NUMERO" --notes "Version publiée automatiquement." --latest \
            || gh release upload "v$NUMERO" LFARM.apk --clobber
          pip install -q google-auth requests
          python3 scripts/publier_version.py
