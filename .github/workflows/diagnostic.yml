name: Diagnostic connexion
on:
  push:
    branches: [main]
    paths: [scripts/diagnostic.py]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q google-auth requests
      - env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SA }}
        run: python3 scripts/diagnostic.py > diag.log 2>&1 || true
      - run: |
          git config user.name "github-actions"; git config user.email "actions@github.com"
          git checkout -q --orphan journaux-diag; git rm -rfq --cached .
          git add diag.log; git commit -qm diag; git push -qf origin journaux-diag
