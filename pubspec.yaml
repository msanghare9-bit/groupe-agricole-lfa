name: groupeagricole
description: Suivi des plantes et des arrosages du Groupe Agricole du LFA Kébémer.
publish_to: 'none'
version: 0.3.0+3

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  firebase_core: any
  firebase_auth: any
  cloud_firestore: any
  shared_preferences: any
  image_picker: any
  package_info_plus: any
  url_launcher: any
  firebase_messaging: any
  flutter_local_notifications: ^19.0.0
  timezone: ^0.10.0
  permission_handler: any

flutter:
  uses-material-design: true
