name: groupeagricole
description: Suivi des plantes et des arrosages du Groupe Agricole du LFA Kébémer.
publish_to: 'none'
version: 0.5.1+9

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^4.15.0
  firebase_auth: ^6.7.0
  cloud_firestore: ^6.10.0
  shared_preferences: any
  image_picker: any
  package_info_plus: any
  url_launcher: any
  google_fonts: any
  http: any
  firebase_messaging: ^16.7.0
  flutter_local_notifications: ^19.0.0
  timezone: ^0.10.0

dependency_overrides:
  shared_preferences_android: 2.4.28

flutter:
  uses-material-design: true
